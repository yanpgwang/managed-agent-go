      unevaluatedProperties: false
    SessionExecutionError:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          description: api_error may appear only in histories written before the terminal Session error contract.
          enum:
            - unknown_error
            - model_overloaded_error
            - model_rate_limited_error
            - model_request_failed_error
            - mcp_connection_failed_error
            - mcp_authentication_failed_error
            - billing_error
            - credential_host_unreachable_error
            - api_error
        message: {type: string}
        retry_status:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [retrying, exhausted, terminal]}
        mcp_server_name: {type: string}
        credential_id: {type: string}
        vault_id: {type: string}
      additionalProperties: false
    SessionErrorEvent:
      allOf:
        - $ref: '#/components/schemas/PersistedSessionEventBase'
