      oneOf:
        - $ref: '#/components/schemas/SessionEndTurn'
        - $ref: '#/components/schemas/SessionRequiresAction'
        - $ref: '#/components/schemas/SessionRetriesExhausted'
      discriminator:
        propertyName: type
    SessionStatusIdleEvent:
      allOf:
        - $ref: '#/components/schemas/PersistedSessionEventBase'
        - type: object
          required: [type, stop_reason]
          properties:
            type: {type: string, const: session.status_idle}
            stop_reason: {$ref: '#/components/schemas/SessionStopReason'}
      unevaluatedProperties: false
    SessionStatusRunningEvent:
      allOf:
        - $ref: '#/components/schemas/PersistedSessionEventBase'
        - type: object
          required: [type]
          properties:
            type: {type: string, const: session.status_running}
      unevaluatedProperties: false
    SessionStatusTerminatedEvent:
      allOf:
        - $ref: '#/components/schemas/PersistedSessionEventBase'
        - type: object
          required: [type]
