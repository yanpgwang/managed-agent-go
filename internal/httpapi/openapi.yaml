    EventStart:
      type: object
      description: Ephemeral preview frame; never persisted in Session event history.
      additionalProperties: false
      required: [type, event]
      properties:
        type: {type: string, const: event_start}
        event: {$ref: '#/components/schemas/EventStartPreview'}
    EventDeltaContent:
      type: object
      additionalProperties: false
      required: [type, index, content]
      properties:
        type: {type: string, const: content_delta}
        index: {type: integer, minimum: 0}
        content: {$ref: '#/components/schemas/TextBlockInput'}
    EventDelta:
      type: object
      description: Ephemeral best-effort preview frame; the persisted event is authoritative.
      additionalProperties: false
      required: [type, event_id, delta]
      properties:
        type: {type: string, const: event_delta}
        event_id: {type: string}
        delta: {$ref: '#/components/schemas/EventDeltaContent'}
    EventStreamFrame:
      description: JSON payload carried by one SSE data frame.
      oneOf:
        - $ref: '#/components/schemas/SessionEvent'
        - $ref: '#/components/schemas/EventStart'
        - $ref: '#/components/schemas/EventDelta'
      discriminator:
        propertyName: type
